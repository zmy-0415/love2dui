name: CI

on:
  push:
  pull_request:

jobs:
  # 纯 Lua 冒烟：证明框架不依赖全局 love，可在任意装了 Lua 的机器上跑
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: [luajit, lua5.1, lua5.4]
    steps:
      - uses: actions/checkout@v4
      - name: Install interpreters
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 lua5.4
      - name: Headless smoke tests (${{ matrix.lua }})
        run: ${{ matrix.lua }} tests/headless.lua

  # 真实图形环境下的完整测试套件（xvfb + 软件渲染）
  love-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE and X server
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb libgl1-mesa-dri libsdl2-2.0-0
      - name: Run full test suite
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LUMI_VERIFY: "1"
        run: xvfb-run -a love .

  # 静态检查。历史代码尚未清理到零告警，因此暂不阻塞合并（看日志而非看红灯）。
  luacheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luacheck || sudo apt-get install -y lua-check
      - name: Lint framework
        run: luacheck lumi tests demo main.lua
